name: Package smoke

on:
  push:
    paths:
      - .github/workflows/package-smoke.yml

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Package static contract
        shell: bash
        run: |
          python scripts/package_release.py --target linux-x64-gnu --runtime Cargo.toml --release-tag nightly --output build
          python - <<'PY'
          import json, zipfile
          with zipfile.ZipFile('build/map-linux-x64-gnu.zip') as z:
              names = set(z.namelist())
              assert 'LICENSE' in names
              assert 'SKILL.md' in names
              assert 'AGENTS.md' in names
              assert 'schema.surql' in names
              manifest = json.loads(z.read('manifest.json'))
              assert list(manifest['runtime_artifacts']) == ['linux-x64-gnu']
              assert manifest['runtime_artifacts']['linux-x64-gnu'] in names
          PY

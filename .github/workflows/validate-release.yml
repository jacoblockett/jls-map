name: Validate release pipeline

on:
  push:
    paths:
      - .github/workflows/validate-release.yml

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2025
            rust_target: x86_64-pc-windows-msvc
            executable: map.exe
            musl: false
          - target: windows-arm64
            runner: windows-11-vs2026-arm
            rust_target: aarch64-pc-windows-msvc
            executable: map.exe
            musl: false
          - target: macos-x64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            executable: map
            musl: false
          - target: macos-arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
            executable: map
            musl: false
          - target: linux-x64-gnu
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            executable: map
            musl: false
          - target: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            executable: map
            musl: false
          - target: linux-x64-musl
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-musl
            executable: map
            musl: true
          - target: linux-arm64-musl
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
            executable: map
            musl: true
    runs-on: "${{ matrix.runner }}"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          targets: ${{ matrix.rust_target }}
      - name: Configure musl toolchain
        if: matrix.musl == true
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [[ '${{ matrix.target }}' == 'linux-x64-musl' ]]; then
            echo 'CC_x86_64_unknown_linux_musl=musl-gcc' >> "$GITHUB_ENV"
            echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
          else
            echo 'CC_aarch64_unknown_linux_musl=musl-gcc' >> "$GITHUB_ENV"
            echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
          fi
      - name: Build
        shell: bash
        run: |
          cargo build --locked --release --target "${{ matrix.rust_target }}"
      - name: Launch
        shell: bash
        run: |
          "./target/${{ matrix.rust_target }}/release/${{ matrix.executable }}" --help >/dev/null
      - name: Test
        if: matrix.target == 'linux-x64-gnu'
        shell: bash
        run: |
          cargo test --locked
      - name: Package
        shell: bash
        run: |
          python scripts/package_release.py \
            --target '${{ matrix.target }}' \
            --runtime 'target/${{ matrix.rust_target }}/release/${{ matrix.executable }}' \
            --release-tag nightly \
            --output build
      - uses: actions/upload-artifact@v4
        with:
          name: validate-${{ matrix.target }}
          if-no-files-found: error
          path: |
            build/map-${{ matrix.target }}.zip
            build/fragment-${{ matrix.target }}.json

  aggregate:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: validate-*
          path: build/targets
          merge-multiple: false
      - name: Aggregate
        shell: bash
        run: |
          python scripts/aggregate_release.py --input build/targets --output build/release --release-tag nightly
      - name: Verify bundle size
        shell: bash
        run: |
          test "$(find build/release -maxdepth 1 -type f | wc -l)" -eq 9

name: 'Build (Do Not Use)'

on:
  workflow_call:
    inputs:
      target:
        description: Build target
        required: false
        default: all
        type: string
      version:
        description: Version to inject; defaults to current stable
        required: false
        default: ''
        type: string
      release_tag:
        description: Release tag used in generated artifact URLs
        required: false
        default: dev
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      matrix: ${{ steps.prepare.outputs.matrix }}
      aggregate: ${{ steps.prepare.outputs.aggregate }}
    steps:
      - name: Resolve build
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TARGET: ${{ inputs.target }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          version="$REQUESTED_VERSION"
          if [[ -z "$version" ]]; then
            version=0.0.0
            latest_tag="$(gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '[.[] | select(.draft == false and .prerelease == false)][0].tag_name // empty')"
            if [[ -n "$latest_tag" ]]; then
              [[ "$latest_tag" =~ ^v[0-9]+.[0-9]+.[0-9]+$ ]] || { echo "Latest stable release tag must be vMAJOR.MINOR.PATCH: $latest_tag" >&2; exit 1; }
              version="${latest_tag#v}"
            fi
          fi
          [[ "$version" =~ ^[0-9]+.[0-9]+.[0-9]+$ ]] || { echo "Build version must be plain semver: $version" >&2; exit 1; }

          all_matrix="$(jq -nc '{include:[
            {target:"windows-x64",runner:"windows-2025",rust_target:"x86_64-pc-windows-msvc",executable:"map.exe",musl:false},
            {target:"windows-arm64",runner:"windows-11-vs2026-arm",rust_target:"aarch64-pc-windows-msvc",executable:"map.exe",musl:false},
            {target:"macos-x64",runner:"macos-15-intel",rust_target:"x86_64-apple-darwin",executable:"map",musl:false},
            {target:"macos-arm64",runner:"macos-15",rust_target:"aarch64-apple-darwin",executable:"map",musl:false},
            {target:"linux-x64-gnu",runner:"ubuntu-24.04",rust_target:"x86_64-unknown-linux-gnu",executable:"map",musl:false},
            {target:"linux-arm64-gnu",runner:"ubuntu-24.04-arm",rust_target:"aarch64-unknown-linux-gnu",executable:"map",musl:false},
            {target:"linux-x64-musl",runner:"ubuntu-24.04",rust_target:"x86_64-unknown-linux-musl",executable:"map",musl:true},
            {target:"linux-arm64-musl",runner:"ubuntu-24.04-arm",rust_target:"aarch64-unknown-linux-musl",executable:"map",musl:true}
          ]}')"

          matrix="$all_matrix"
          aggregate=true
          if [[ "$REQUESTED_TARGET" != all ]]; then
            matrix="$(jq -c --arg target "$REQUESTED_TARGET" '{include: [.include[] | select(.target == $target)]}' <<< "$all_matrix")"
            [[ "$(jq '.include | length' <<< "$matrix")" -eq 1 ]] || { echo "Unknown build target: $REQUESTED_TARGET" >&2; exit 1; }
            aggregate=false
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "aggregate=$aggregate" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: "${{ matrix.runner }}"
    steps:
      - uses: actions/checkout@v4

      - name: Configure Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup target add --toolchain 1.89.0 '${{ matrix.rust_target }}'

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.rust_target }}

      - name: Configure musl toolchain
        if: matrix.musl == true
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [[ '${{ matrix.target }}' == 'linux-x64-musl' ]]; then
            echo 'CC_x86_64_unknown_linux_musl=musl-gcc' >> "$GITHUB_ENV"
            echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
          else
            echo 'CC_aarch64_unknown_linux_musl=musl-gcc' >> "$GITHUB_ENV"
            echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
          fi

      - name: Build Map runtime
        shell: bash
        run: cargo +1.89.0 build --locked --release --target "${{ matrix.rust_target }}"

      - name: Launch Map runtime
        shell: bash
        run: "./target/${{ matrix.rust_target }}/release/${{ matrix.executable }}" --help >/dev/null

      - name: Run Map regressions
        if: matrix.target == 'linux-x64-gnu'
        shell: bash
        run: cargo +1.89.0 test --locked

      - name: Upload target runtime
        uses: actions/upload-artifact@v4
        with:
          name: target-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: target/${{ matrix.rust_target }}/release/${{ matrix.executable }}

  aggregate:
    needs: [prepare, build]
    if: needs.prepare.outputs.aggregate == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all target runtimes
        uses: actions/download-artifact@v4
        with:
          pattern: target-*
          path: build/targets
          merge-multiple: false

      - name: Package and verify complete Map release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          targets=(windows-x64 windows-arm64 macos-x64 macos-arm64 linux-x64-gnu linux-arm64-gnu linux-x64-musl linux-arm64-musl)
          executables=(map.exe map.exe map map map map map map)

          version="$BUILD_VERSION"
          [[ "$version" =~ ^[0-9]+.[0-9]+.[0-9]+$ ]]
          [[ "$(jq -r '.name' manifest.json)" == map ]]

          rm -rf build/release
          mkdir -p build/release
          jq --arg version "$version" '
            {name, version: $version, description, artifacts: {}}
            + (if has("dependencies") then {dependencies} else {} end)
          ' manifest.json > build/release/manifest.json

          for i in "${!targets[@]}"; do
            target="${targets[$i]}"
            executable="${executables[$i]}"
            runtime_path="$(jq -er --arg target "$target" '.runtime_artifacts[$target]' manifest.json)"
            source="build/targets/target-$target/$executable"
            archive="$PWD/build/release/map-$target.zip"
            stage="$PWD/build/.package-$target"

            test -f "$source"
            rm -rf "$stage"
            mkdir -p "$stage/$(dirname "$runtime_path")"
            cp SKILL.md AGENTS.md schema.surql LICENSE "$stage/"
            cp -R agents "$stage/agents"
            cp "$source" "$stage/$runtime_path"
            if [[ "$target" != windows-* ]]; then chmod +x "$stage/$runtime_path"; fi

            jq --arg version "$version" --arg target "$target" --arg runtime_path "$runtime_path"               '. + {version: $version} | .runtime_artifacts = {($target): $runtime_path}'               manifest.json > "$stage/manifest.json"

            (cd "$stage" && zip -q -r "$archive" .)
            rm -rf "$stage"

            sha256="$(sha256sum "$archive" | cut -d' ' -f1)"
            url="https://github.com/jacoblockett/jls-map/releases/download/$RELEASE_TAG/map-$target.zip"
            tmp="$(mktemp)"
            jq --arg target "$target" --arg url "$url" --arg sha256 "$sha256"               '.artifacts[$target] = {url: $url, sha256: $sha256}'               build/release/manifest.json > "$tmp"
            mv "$tmp" build/release/manifest.json
          done

          test "$(find build/release -maxdepth 1 -type f | wc -l)" -eq 9
          test "$(jq '.artifacts | length' build/release/manifest.json)" -eq 8
          jq -e --slurp '
            .[0].description == .[1].description
            and (.[0].dependencies // null) == (.[1].dependencies // null)
          ' build/release/manifest.json manifest.json >/dev/null

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          if-no-files-found: error
          retention-days: 14
          path: build/release/*

name: Build

on:
  push:
    branches:
      - main
    paths:
      - manifest.json
  schedule:
    - cron: '0 23 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:
    inputs:
      action:
        description: What to run
        required: true
        default: build
        type: choice
        options:
          - build
          - nightly
          - stable
      version:
        description: Stable semantic version (for example 0.1.0)
        required: false
        type: string
      force:
        description: Force a nightly even when no build-relevant source changed
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: jls-map-build
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      should_build: ${{ steps.mode.outputs.should_build }}
      release_tag: ${{ steps.mode.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          mode=nightly
          if [[ '${{ github.event_name }}' == 'workflow_dispatch' ]]; then
            mode='${{ inputs.action }}'
          elif [[ '${{ github.event_name }}' == 'push' ]]; then
            mode=stable
          fi
          if [[ '${{ github.ref }}' != 'refs/heads/main' ]]; then
            echo 'Build and release automation may only run from main.' >&2
            exit 1
          fi

          manifest_version="$(jq -er '.version' manifest.json)"
          if [[ ! "$manifest_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Map manifest version must be plain semver: $manifest_version" >&2
            exit 1
          fi

          semver_gt() {
            local lhs="$1"
            local rhs="$2"
            local l_major l_minor l_patch r_major r_minor r_patch
            IFS=. read -r l_major l_minor l_patch <<< "$lhs"
            IFS=. read -r r_major r_minor r_patch <<< "$rhs"
            if (( 10#$l_major != 10#$r_major )); then (( 10#$l_major > 10#$r_major )); return; fi
            if (( 10#$l_minor != 10#$r_minor )); then (( 10#$l_minor > 10#$r_minor )); return; fi
            (( 10#$l_patch > 10#$r_patch ))
          }

          should_build=true
          release_tag=dev
          if [[ "$mode" == nightly ]]; then
            force='${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}'
            if [[ "$should_build" == true && "$force" != true ]]; then
              git fetch origin --tags --force
              if git rev-parse -q --verify refs/tags/nightly >/dev/null; then
                mapfile -t files < <(git diff --name-only nightly..HEAD -- .github/workflows/build.yml Cargo.toml Cargo.lock manifest.json SKILL.md AGENTS.md schema.surql src tests agents)
                if (( ${#files[@]} == 0 )); then should_build=false; fi
              fi
            fi
            release_tag=nightly
          elif [[ "$mode" == stable ]]; then
            if [[ '${{ github.event_name }}' == 'push' ]]; then
              before='${{ github.event.before }}'
              if [[ "$before" =~ ^0+$ ]]; then
                echo 'Automatic stable release cannot determine the previous commit version.' >&2
                exit 1
              fi
              previous_version="$(git show "$before:manifest.json" | jq -er '.version')"
              if [[ ! "$previous_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "Previous Map manifest version must be plain semver: $previous_version" >&2
                exit 1
              fi
              if [[ "$manifest_version" == "$previous_version" ]]; then
                should_build=false
              elif ! semver_gt "$manifest_version" "$previous_version"; then
                echo "Map version must increase for an automatic stable release: $previous_version -> $manifest_version." >&2
                exit 1
              fi
              requested_version="$manifest_version"
            else
              requested_version='${{ inputs.version }}'
              if [[ ! "$requested_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo 'Stable releases require an explicit plain-semver version input, for example 0.1.0.' >&2
                exit 1
              fi
              if [[ "$requested_version" != "$manifest_version" ]]; then
                echo "Requested stable version $requested_version does not match manifest.json version $manifest_version." >&2
                exit 1
              fi
            fi

            if [[ "$should_build" == true ]]; then
              release_tag="v$requested_version"
              git fetch origin --tags --force
              if git rev-parse -q --verify "refs/tags/$release_tag" >/dev/null; then
                echo "Tag $release_tag already exists." >&2
                exit 1
              fi
            fi
          elif [[ "$mode" != build ]]; then
            echo "Unknown build mode: $mode" >&2
            exit 1
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: No release build
        if: steps.mode.outputs.should_build != 'true'
        run: echo 'Nothing to build or publish.'

  build:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2025
            rust_target: x86_64-pc-windows-msvc
            executable: map.exe
            musl: false
          - target: windows-arm64
            runner: windows-11-vs2026-arm
            rust_target: aarch64-pc-windows-msvc
            executable: map.exe
            musl: false
          - target: macos-x64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            executable: map
            musl: false
          - target: macos-arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
            executable: map
            musl: false
          - target: linux-x64-gnu
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            executable: map
            musl: false
          - target: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            executable: map
            musl: false
          - target: linux-x64-musl
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-musl
            executable: map
            musl: true
          - target: linux-arm64-musl
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
            executable: map
            musl: true
    runs-on: "${{ matrix.runner }}"
    steps:
      - uses: actions/checkout@v4

      - name: Configure Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup target add --toolchain 1.89.0 '${{ matrix.rust_target }}'

      - name: Configure musl toolchain
        if: matrix.musl == true
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [[ '${{ matrix.target }}' == 'linux-x64-musl' ]]; then
            echo 'CC_x86_64_unknown_linux_musl=musl-gcc' >> "$GITHUB_ENV"
            echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
          else
            echo 'CC_aarch64_unknown_linux_musl=musl-gcc' >> "$GITHUB_ENV"
            echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
          fi

      - name: Build Map runtime
        shell: bash
        run: |
          cargo +1.89.0 build --locked --release --target "${{ matrix.rust_target }}"

      - name: Launch Map runtime
        shell: bash
        run: |
          "./target/${{ matrix.rust_target }}/release/${{ matrix.executable }}" --help >/dev/null

      - name: Run Map regressions
        if: matrix.target == 'linux-x64-gnu'
        shell: bash
        run: |
          cargo +1.89.0 test --locked

      - name: Upload target runtime
        uses: actions/upload-artifact@v4
        with:
          name: target-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: target/${{ matrix.rust_target }}/release/${{ matrix.executable }}

  aggregate:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all target runtimes
        uses: actions/download-artifact@v4
        with:
          pattern: target-*
          path: build/targets
          merge-multiple: false

      - name: Package and verify complete Map release
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail

          targets=(
            windows-x64
            windows-arm64
            macos-x64
            macos-arm64
            linux-x64-gnu
            linux-arm64-gnu
            linux-x64-musl
            linux-arm64-musl
          )
          executables=(
            map.exe
            map.exe
            map
            map
            map
            map
            map
            map
          )

          version="$(jq -er '.version' manifest.json)"
          min_installer="$(jq -er '.min_installer' manifest.json)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$min_installer" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(jq -r '.name' manifest.json)" == map ]]
          [[ "$(jq -r '.format' manifest.json)" == 1 ]]

          rm -rf build/release
          mkdir -p build/release
          jq -n \
            --arg version "$version" \
            --arg min_installer "$min_installer" \
            '{format: 1, name: "map", version: $version, min_installer: $min_installer, artifacts: {}}' \
            > build/release/manifest.json

          for i in "${!targets[@]}"; do
            target="${targets[$i]}"
            executable="${executables[$i]}"
            runtime_path="$(jq -er --arg target "$target" '.runtime_artifacts[$target]' manifest.json)"
            source="build/targets/target-$target/$executable"
            archive="$PWD/build/release/map-$target.zip"
            stage="$PWD/build/.package-$target"

            test -f "$source"
            rm -rf "$stage"
            mkdir -p "$stage/$(dirname "$runtime_path")"
            cp SKILL.md AGENTS.md schema.surql LICENSE "$stage/"
            cp -R agents "$stage/agents"
            cp "$source" "$stage/$runtime_path"
            if [[ "$target" != windows-* ]]; then chmod +x "$stage/$runtime_path"; fi

            jq --arg target "$target" --arg runtime_path "$runtime_path" \
              '.runtime_artifacts = {($target): $runtime_path}' \
              manifest.json > "$stage/manifest.json"

            (
              cd "$stage"
              zip -q -r "$archive" .
            )
            rm -rf "$stage"

            sha256="$(sha256sum "$archive" | cut -d' ' -f1)"
            url="https://github.com/jacoblockett/jls-map/releases/download/$RELEASE_TAG/map-$target.zip"
            tmp="$(mktemp)"
            jq \
              --arg target "$target" \
              --arg url "$url" \
              --arg sha256 "$sha256" \
              '.artifacts[$target] = {url: $url, sha256: $sha256}' \
              build/release/manifest.json > "$tmp"
            mv "$tmp" build/release/manifest.json
          done

          test "$(find build/release -maxdepth 1 -type f | wc -l)" -eq 9
          test "$(jq '.artifacts | length' build/release/manifest.json)" -eq 8

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          if-no-files-found: error
          retention-days: 14
          path: build/release/*

  publish:
    needs: [prepare, aggregate]
    if: needs.prepare.outputs.should_build == 'true' && needs.prepare.outputs.mode != 'build'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: build/release

      - name: Publish verified release bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_MODE: ${{ needs.prepare.outputs.mode }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find build/release -maxdepth 1 -type f -print | sort)
          if (( ${#assets[@]} == 0 )); then echo 'Verified release bundle is empty.' >&2; exit 1; fi

          if [[ "$RELEASE_MODE" == nightly ]]; then
            if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
              gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GH_REPO" --clobber
              mapfile -t existing < <(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json assets --jq '.assets[].name')
              for name in "${existing[@]}"; do
                if [[ ! -f "build/release/$name" ]]; then gh release delete-asset "$RELEASE_TAG" "$name" --repo "$GH_REPO" -y; fi
              done
            else
              gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GH_REPO" --title 'Nightly' --notes 'Rolling production-test build from main.' --prerelease --target "$GITHUB_SHA"
            fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -f nightly "$GITHUB_SHA"
            git push origin refs/tags/nightly --force
          else
            min_installer="$(jq -er '.min_installer' manifest.json)"
            gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GH_REPO" --title "$RELEASE_TAG" --notes "Requires JLS installer $min_installer or newer." --generate-notes --target "$GITHUB_SHA"
          fi

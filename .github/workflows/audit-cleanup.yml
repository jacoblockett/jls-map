name: JLS-Map cleanup audit

on:
  push:
    paths:
      - .github/workflows/audit-cleanup.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh Cargo lockfile
        run: cargo check
      - name: Verify cleanup
        shell: bash
        run: |
          set -euo pipefail
          forbidden='jl-skills|\.jl-skills|skills/map|INSTALLER_SPEC|TODO\.md|RELEASES\.md|JL_MAP_CLI|AGENTS\.fragment'
          if grep -RInE --exclude=README.md --exclude=audit-cleanup.yml --exclude-dir=.git "$forbidden" .; then
            echo 'Legacy JLS/monorepo references remain outside README.' >&2
            exit 1
          fi
          if grep -RInE --exclude=README.md --exclude=Cargo.lock --exclude=audit-cleanup.yml --exclude-dir=.git '0\.2\.0|0\.5\.0|0\.7\.0' .; then
            echo 'Legacy project version references remain outside README/Cargo dependency versions.' >&2
            exit 1
          fi
          if grep -RInE 'installer' src tests harnesses SKILL.md AGENTS.md; then
            echo 'Installer-specific references remain in Map behavior/source files.' >&2
            exit 1
          fi
          grep -A2 -n '^name = "map-runtime"$' Cargo.lock
      - name: Test runtime
        run: cargo test --locked
      - name: Commit lockfile refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh Map lockfile metadata'
          git push
